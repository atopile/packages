# Motor Fader Firmware - Zephyr Configuration

# General
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y

# Console / Shell (optional for debugging)
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y

# GPIO
CONFIG_GPIO=y

# PWM for motor control
CONFIG_PWM=y

# ADC for position and current sensing
CONFIG_ADC=y

# Timer for control loop
CONFIG_COUNTER=y

# Non-volatile storage for calibration data
CONFIG_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y

# Floating point support for PID calculations
CONFIG_FPU=y

# USB CDC for serial output (ESP32-S3 native USB)
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
CONFIG_USB_DEVICE_PRODUCT="Motor Fader Controller"
CONFIG_USB_DEVICE_VID=0x303A
CONFIG_USB_DEVICE_PID=0x1001

# ESP32-S3 specific
CONFIG_SOC_ESP32S3_PROCPU=y

# Touch sensor (ESP32-S3 has hardware touch)
# Note: Zephyr touch support varies - may need custom driver


; PlatformIO Project Configuration File
; Motor Fader Firmware for ESP32-S3
;
; Build: pio run
; Upload: pio run --target upload
; Monitor: pio device monitor

[platformio]
src_dir = src_arduino
default_envs = esp32-s3

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino

; Upload settings
upload_speed = 921600
monitor_speed = 115200

; Build flags
build_flags = 
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3

; Library dependencies (none needed for basic operation)
lib_deps =

; Upload using native USB - leave empty for auto-detect
; upload_port = /dev/cu.usbmodem*
; monitor_port = /dev/cu.usbmodem*


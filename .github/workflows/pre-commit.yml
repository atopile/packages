on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - '**'

jobs:
  pre-commit:
    runs-on: [self-hosted]
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version-file: .python-version

    - uses: pre-commit/action@v3.0.1

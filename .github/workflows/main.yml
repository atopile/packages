on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

jobs:
  define-packages:
    runs-on: ubuntu-latest

    outputs:
      packages: ${{ steps.packages.outputs.packages }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Discover changed packages
        id: packages
        run: |
          case "${{ github.event_name }}" in
            "push")
              base_ref="${{ github.event.before }}"
              ;;
            "pull_request")
              base_ref="${{ github.event.pull_request.base.sha }}"
              ;;
            *)
              base_ref=""
              ;;
          esac

          packages=$(scripts/discover-changed-packages.sh "${{ github.event_name }}" "$base_ref")
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

  build-verify-publish:
    permissions:
      contents: read
      packages: read
      id-token: write
    runs-on: ubuntu-latest
    needs: define-packages
    if: needs.define-packages.outputs.packages != '[]'
    strategy:
      matrix:
        package: ${{ fromJSON(needs.define-packages.outputs.packages) }}
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      # FIXME: handle deps properly
      # ideally it'd determine if the package is in the same repo and, if so,
      # install via file instead
      - uses: atopile/setup-atopile@v1.6
        with:
          working-directory: ${{ matrix.package }}
      - run: ato sync
        working-directory: ${{ matrix.package }}

      - run: ato build
        working-directory: ${{ matrix.package }}

      - run: ato package verify -s
        working-directory: ${{ matrix.package }}

      - uses: atopile/publish-package@v1
        name: Publish package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          package-entrypoint: ${{ matrix.package }}
          skip-duplicate-versions: true
          package-version: "" # Use the embedded version key
          ato-config: ${{ matrix.package }}/ato.yaml

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.package }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ matrix.package }}/build/logs/**
            ${{ matrix.package }}/build/**/*.log
          if-no-files-found: warn
          retention-days: 14

  verify-matrix:
    runs-on: ubuntu-latest
    needs: [build-verify-publish]
    if: always()
    steps:
      - name: Fail if any matrix job failed
        run: |
          echo "matrix result: ${{ needs.build-verify-publish.result }}"
          if [ "${{ needs.build-verify-publish.result }}" != "success" ] && [ "${{ needs.build-verify-publish.result }}" != "skipped" ]; then
            echo "One or more matrix jobs failed."
            exit 1
          fi
          echo "All matrix jobs passed."

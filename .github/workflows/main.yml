on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

jobs:
  define-packages:
    runs-on: ubuntu-latest

    outputs:
      packages: ${{ steps.packages.outputs.packages }}

    steps:
      - uses: actions/checkout@v4

      - name: Discover changed packages
        id: packages
        run: |
          case "${{ github.event_name }}" in
            "push")
              base_ref="${{ github.event.before }}"
              ;;
            "pull_request")
              base_ref="${{ github.event.pull_request.base.sha }}"
              ;;
            *)
              base_ref=""
              ;;
          esac

          set -o xtrace
          packages=$(scripts/discover-changed-packages.sh "${{ github.event_name }}" "$base_ref")
          set +o xtrace

          echo "packages=$packages" >> "$GITHUB_OUTPUT"

  test-and-publish:
    permissions:
      contents: read
      packages: read
      id-token: write
    runs-on: ubuntu-latest
    needs: define-packages
    if: needs.define-packages.outputs.packages != '[]'
    strategy:
      matrix:
        package: ${{ fromJSON(needs.define-packages.outputs.packages) }}
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      # FIXME: handle deps properly
      # ideally it'd determine if the package is in the same repo and, if so,
      # install via file instead
      - uses: atopile/setup-atopile@v1.6
        with:
          working-directory: ${{ matrix.package }}
      - run: ato sync
        working-directory: ${{ matrix.package }}

      - run: ato build
        working-directory: ${{ matrix.package }}

      - uses: atopile/publish-package@v1
        name: Publish package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          package-entrypoint: ${{ matrix.package }}
          skip-duplicate-versions: true
          package-version: "" # Use the embedded version key
          ato-config: ${{ matrix.package }}/ato.yaml

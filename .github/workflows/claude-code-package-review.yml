name: Claude Code Package Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited, labeled]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:

jobs:
  claude-review:
    # Skip review on draft PRs unless a review is explicitly requested
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request_review' ||
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false)

    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Optional: Specify model (defaults to Claude Sonnet 4, uncomment for Claude Opus 4)
          # model: "claude-opus-4-20250514"

          # Direct prompt for automated review (no @claude mention needed)
          direct_prompt: |
            Please review this pull request for an atopile pacakge and provide feedback on:

            PR Format:
            - Verify the PR title starts with the name of the package being updated

            Code Review:
            - Ensure the pacakge follows the rules outlined in .cursor/rules/how_to_build_packages.mdc
            - Ensure the PR is small and focused on a single package change, and doesn't include any unrelated changes
            - Ensure the exact text of the usage.ato file is included in the readme.md file
            - Code quality and best practices
            - Potential bugs or issues
            - Funcitonality - try to find a datasheet for the main part in the package and check if the part is implemented correctly
            - Use `ato build`, `ato build --frozen`, and `ato package verify` to check if the package is working correctly

            Be constructive and helpful in your feedback.

          # Optional: Use sticky comments to make Claude reuse the same comment on subsequent pushes to the same PR
          use_sticky_comment: true

          # Optional: Customize review based on file types
          # direct_prompt: |
          #   Review this PR focusing on:
          #   - For TypeScript files: Type safety and proper interface usage
          #   - For API endpoints: Security, input validation, and error handling
          #   - For React components: Performance, accessibility, and best practices
          #   - For tests: Coverage, edge cases, and test quality

          # Optional: Different prompts for different authors
          # direct_prompt: |
          #   ${{ github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR' &&
          #   'Welcome! Please review this PR from a first-time contributor. Be encouraging and provide detailed explanations for any suggestions.' ||
          #   'Please provide a thorough code review focusing on our coding standards and best practices.' }}

          # Optional: Add specific tools for running tests or linting
          allowed_tools: "Bash(pre-commit run --all-files),Bash(uv run pytest*),Bash(uv run ato*)"

          # Optional: Skip review for certain conditions
          # if: |
          #   !contains(github.event.pull_request.title, '[skip-review]') &&
          #   !contains(github.event.pull_request.title, '[WIP]')

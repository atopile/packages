requires-atopile: ^0.14.0

paths:
  src: .
  layout: ./layouts

builds:
  default:
    entry: pjrc-teensy-4-1.ato:PJRC_Teensy_4_1
    hide_designators: true
    exclude_checks: [PCB.requires_drc_check]
  usage:
    entry: usage.ato:Usage
    hide_designators: true
    exclude_checks: [PCB.requires_drc_check]

package:
  identifier: atopile/pjrc-teensy-4-1
  repository: https://github.com/atopile/packages
  homepage:
    https://github.com/atopile/packages/blob/main/packages/pjrc-teensy-4-1/README.md
  version: 0.2.0
  authors:
  - name: atopile
    email: hi@atopile.io
  summary: PJRC; Teensy; Teensy 4.1; Arduino; MCU; ARM Cortex-M7; 600MHz;
  license: MIT
dependencies:
- type: registry
  identifier: atopile/usb-connectors
  release: 0.4.0
- type: registry
  identifier: atopile/buttons
  release: 0.4.0

requires-atopile: "^0.12.4"

paths:
  src: ./
  layout: ./layouts

builds:
  default:
    entry: st-lis2mdl.ato:ST_LIS2MDL
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]
  usage:
    entry: usage.ato:Usage
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]

package:
  identifier: atopile/st-lis2mdl
  repository: https://github.com/atopile/packages
  homepage: https://github.com/atopile/packages/blob/main/packages/st-lis2mdl/README.md
  version: "0.1.1"
  authors:
    - name: atopile
      email: hi@atopile.io
  summary: "STMicroelectronics; LIS2MDL; Magnetometer; 3-axis; Sensor; IC; I2C; SPI; Adafruit; 4488; QWIIC; STEMMA"
  license: MIT

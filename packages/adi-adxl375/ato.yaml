requires-atopile: "^0.11.6"

paths:
  src: ./
  layout: ./layouts

builds:
  default:
    entry: adi-adxl375.ato:ADI_ADXL375
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]
  usage:
    entry: usage.ato:Usage
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]

package:
  identifier: atopile/adi-adxl375
  repository: https://github.com/atopile/packages
  homepage: https://github.com/atopile/packages/blob/main/packages/adi-adxl375/README.md
  version: "0.1.1"
  authors:
    - name: atopile
      email: hi@atopile.io
  summary: "Tags: ADI; Analog Devices; ADXL375; Accelerometer; High-G; ±200g; MEMS; SPI; I2C; LGA-14; 3-axis; Shock; Vibration; C481898"
  license: MIT

requires-atopile: ^0.12.4

paths:
  src: .
  layout: ./layouts

builds:
  default:
    entry: maxlinear-sp3485.ato:MaxLinear_SP3485
    hide_designators: true
    exclude_checks: [PCB.requires_drc_check]
  usage:
    entry: usage.ato:Usage
    hide_designators: true
    exclude_checks: [PCB.requires_drc_check]

package:
  identifier: atopile/maxlinear-sp3485
  repository: https://github.com/atopile/packages
  homepage:
    https://github.com/atopile/packages/blob/main/packages/maxlinear-sp3485/README.md
  version: 0.1.1
  authors:
  - name: atopile
    email: hi@atopile.io
  summary: MaxLinear SP3485 3.3V Half-Duplex RS-485 Transceiver
  license: MIT
dependencies:
- type: file
  identifier: atopile/validation-pogo
  path: ../validation-pogo
- type: registry
  identifier: atopile/logos
  release: 0.1.5

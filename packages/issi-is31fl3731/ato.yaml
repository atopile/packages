requires-atopile: "^0.10.8"

paths:
  src: ./
  layout: ./layouts

builds:
  default:
    entry: issi-is31fl3731.ato:ISSI_IS31FL3731
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]
  usage:
    entry: usage.ato:Usage
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]

package:
  identifier: atopile/issi-is31fl3731
  repository: https://github.com/atopile/packages
  homepage: https://github.com/atopile/packages/blob/main/packages/issi-is31fl3731/README.md
  version: "0.1.1"
  authors:
    - name: atopile
      email: hi@atopile.io
  summary: "ISSI; IS31FL3731; LED Matrix Driver; 144 LEDs; I2C; STEMMA; QWIIC; Adafruit; 2946"
  license: MIT

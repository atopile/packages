requires-atopile: ^0.10.12

paths:
  src: .
  layout: ./layouts

builds:
  default:
    entry: microchip-atsamd51j19a.ato:Microchip_ATSAMD51J19A
    hide_designators: true
    exclude_checks: [PCB.requires_drc_check]
  usage:
    entry: usage.ato:Usage
    hide_designators: true
    exclude_checks: [PCB.requires_drc_check]

package:
  identifier: atopile/microchip-atsamd51j19a
  repository: https://github.com/atopile/packages
  homepage: https://github.com/atopile/packages/blob/main/packages/microchip-atsamd51j19a/README.md
  version: 0.1.0
  authors:
    - name: atopile
      email: hi@atopile.io
  summary: Microchip; ATSAMD51; microcontroller; Arduino; CircuitPython; Adafruit; 3857; Feather; Cortex; M4
  license: MIT

dependencies:
  - type: registry
    identifier: atopile/st-ldk220
    release: 0.2.1
  - type: registry
    identifier: atopile/addressable-leds
    release: 0.2.6
  - type: registry
    identifier: atopile/buttons
    release: 0.2.4

  repository: https://github.com/atopile/packages
  homepage: https://github.com/atopile/packages/blob/main/packages/ti-ina185a2/README.md
  version: "0.1.0"
  authors:
    - name: atopile
      email: hi@atopile.io
  summary: "TI; INA185A2; Current; Sense; Amplifier; Analog; Shunt"
  license: MIT

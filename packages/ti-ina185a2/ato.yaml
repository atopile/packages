requires-atopile: "^0.14.0"

paths:
  src: ./
  layout: ./layouts

builds:
  default:
    entry: ti-ina185a2.ato:TI_INA185A2
    hide_designators: true
    exclude_checks:
      - PCB.requires_drc_check
  usage:
    entry: usage.ato:Usage
    hide_designators: true
    exclude_checks:
      - PCB.requires_drc_check

package:

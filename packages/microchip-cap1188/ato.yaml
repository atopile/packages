requires-atopile: ^0.14.0
paths:
  src: ./
  layout: ./layouts
builds:
  default:
    entry: microchip-cap1188.ato:Microchip_CAP1188
    hide_designators: true
    exclude_checks:
    - PCB.requires_drc_check
  usage:
    entry: usage.ato:Usage
    hide_designators: true
    exclude_checks:
    - PCB.requires_drc_check
package:
  identifier: atopile/microchip-cap1188
  repository: https://github.com/atopile/packages
  homepage: https://github.com/atopile/packages/blob/main/packages/microchip-cap1188/README.md
  version: 0.3.0
  authors:
  - name: atopile
    email: hi@atopile.io
  summary: 'Tags: Microchip; CAP1188; Capacitive; Touch; Sensor; IC; I2C; SPI; 8-Channel;
    QFN; Proximity; Button'
  license: MIT

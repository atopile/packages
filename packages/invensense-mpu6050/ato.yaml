requires-atopile: "^0.10.8"

paths:
  src: ./
  layout: ./layouts

builds:
  default:
    entry: invensense-mpu6050.ato:Invensense_MPU6050
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]
  usage:
    entry: usage.ato:Usage
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]

package:
  identifier: atopile/invensense-mpu6050
  repository: https://github.com/atopile/packages
  homepage: https://github.com/atopile/packages/blob/main/packages/invensense-mpu6050/README.md
  version: "0.1.2"
  authors:
    - name: atopile
      email: hi@atopile.io
  summary: "TDK InvenSense; MPU-6050; 6-axis; IMU; Accelerometer; Gyroscope; Sensor; IC; I2C"
  license: MIT

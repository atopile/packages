requires-atopile: ^0.14.0
paths:
  src: "./"
  layout: ./layouts
builds:
  default:
    entry: nuvoton-nau7802.ato:Nuvoton_NAU7802_Single
    hide_designators: true
    exclude_checks:
      - 'PCB.requires_drc_check'
  dual:
    entry: nuvoton-nau7802.ato:Nuvoton_NAU7802_Dual
    hide_designators: true
    exclude_checks:
      - 'PCB.requires_drc_check'
  usage:
    entry: usage.ato:Usage
    hide_designators: true
    exclude_checks:
      - 'PCB.requires_drc_check'
package:
  identifier: atopile/nuvoton-nau7802
  repository: https://github.com/atopile/packages
  homepage: https://github.com/atopile/packages/blob/main/packages/nuvoton-nau7802/README.md
  version: "0.4.0"
  authors:
    - name: atopile
      email: hi@atopile.io
  summary: High-precision 24-bit, low-noise, low-power, digital output load cell amplifier
  license: MIT

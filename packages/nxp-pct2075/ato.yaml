requires-atopile: ^0.14.0

paths:
  src: ./
  layout: ./layouts

builds:
  default:
    entry: nxp-pct2075.ato:NXP_PCT2075
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]
  usage:
    entry: usage.ato:Usage
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]

package:
  identifier: atopile/nxp-pct2075
  repository: https://github.com/atopile/packages
  homepage: https://github.com/atopile/packages/blob/main/packages/nxp-pct2075/README.md
  version: "0.2.0"
  authors:
    - name: atopile
      email: hi@atopile.io
  summary: "Tags: NXP; PCT2075; Temperature; Sensor; IC; I2C; Digital; Thermal; Monitoring; Adafruit; 4369; STEMMA"
  license: MIT

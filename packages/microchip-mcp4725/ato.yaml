requires-atopile: "^0.9.0"

paths:
  src: ./
  layout: ./layouts

builds:
  default:
    entry: microchip-mcp4725.ato:Microchip_MCP4725_driver
    hide_designators: true
    exclude_checks:
      - I2C.requires_pulls
      - PCB.requires_drc_check
  usage:
    entry: usage.ato:Usage
    hide_designators: true
    exclude_checks:
      - I2C.requires_pulls
      - PCB.requires_drc_check
  test:
    entry: microchip-mcp4725.ato:Test
    hide_designators: true
    exclude_checks:
      - I2C.requires_pulls
      - PCB.requires_drc_check

# This metadata is only required for publishing
# Uncomment it and fill out the fields to publish your package
package:
  identifier: atopile/microchip-mcp4725
  repository: https://github.com/atopile/packages
  version: "0.1.6"
  authors:
    - name: atopile
      email: hi@atopile.io
  summary: Microchip MCP4725 DAC 12-Bit I2C
  license: MIT

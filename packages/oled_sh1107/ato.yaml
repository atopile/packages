requires-atopile: "^0.10.8"

paths:
  src: "."
  layout: ./layouts

builds:
  default:
    entry: oled_sh1107.ato:SH1107_128x128
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]
  usage:
    entry: usage.ato:Usage
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]

package:
  identifier: atopile/oled-sh1107
  repository: https://github.com/atopile/packages
  homepage: https://github.com/atopile/packages/blob/main/packages/oled_sh1107/README.md
  version: "0.1.0"
  authors:
    - name: atopile
      email: hi@atopile.io
  summary: SH1107; OLED; 128x128; I²C; 1.3; Adafruit; 4650; 5297; STEMMA; QWIIC
  license: MIT

requires-atopile: ^0.10.6

paths:
  src: .
  layout: ./layouts

builds:
  esp32_c3_mini_1_driver:
    entry: esp32_c3_mini.ato:ESP32_C3_MINI_1_driver
    hide_designators: true
  esp32_c3_mini_1_driver_example:
    entry: esp32_c3_mini.ato:ESP32_C3_MINI_1_driver_example
    hide_designators: true

  esp32_c3_wroom_02_driver:
    entry: esp32_c3_wroom.ato:ESP32_C3_WROOM_02_driver
    hide_designators: true
  esp32_c3_wroom_02_driver_example:
    entry: esp32_c3_wroom.ato:ESP32_C3_WROOM_02_driver_example
    hide_designators: true

package:
  identifier: atopile/espressif-esp32-c3
  repository: https://github.com/atopile/packages
  version: 0.1.0
  authors:
    - name: atopile
      email: hi@atopile.io
  summary: The ESP32-C3 microcontroller family from Espressif
  license: MIT
dependencies:
  - type: registry
    identifier: atopile/buttons
    release: 0.2.2

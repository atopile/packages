requires-atopile: ^0.9.0

paths:
  src: .
  layout: ./layouts

builds:
  esp32s3_base:
    entry: esp32s3.ato:ESP32_S3_WROOM
  esp32c3_base:
    entry: esp32c3.ato:ESP32_C3_WROOM
  # esp32s3-n8r2:
  # entry: esp32s3.ato:ESP32_S3_WROOM_N8R2
  # esp32s3-n8r8:
  #   entry: esp32s3.ato:ESP32_S3_WROOM_N8R8
  # esp32s3-n16r2:
  #   entry: esp32s3.ato:ESP32_S3_WROOM_N16R2
  # esp32s3-n16r8:
  #   entry: esp32s3.ato:ESP32_S3_WROOM_N16R8

package:
  identifier: atopile/esp32
  repository: https://github.com/atopile/packages
  version: 0.1.0
  authors:
  - name: atopile
    email: hi@atopile.io
  summary: The ESP32 microcontroller family from Espressif
  license: MIT
dependencies:
- type: registry
  identifier: atopile/buttons
  release: 0.1.7

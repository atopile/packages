requires-atopile: ^0.10.5

paths:
  src: .
  layout: ./layouts

builds:
  esp32_c3_mini_1_driver:
    entry: esp32_c3_mini.ato:ESP32_C3_MINI_1_driver
    hide_designators: true
  esp32_c3_mini_1_driver_example:
    entry: esp32_c3_mini.ato:ESP32_C3_MINI_1_driver_example
    hide_designators: true

  esp32_c3_wroom_02_driver:
    entry: esp32_c3_wroom.ato:ESP32_C3_WROOM_02_driver
    hide_designators: true
  esp32_c3_wroom_02_driver_example:
    entry: esp32_c3_wroom.ato:ESP32_C3_WROOM_02_driver_example
    hide_designators: true

package:
  identifier: atopile/esp32
  repository: https://github.com/atopile/packages
  version: 0.2.0
  authors:
    - name: atopile
      email: hi@atopile.io
  summary: The ESP32 microcontroller family from Espressif
  license: MIT
dependencies:
  - type: registry
    identifier: atopile/buttons
    release: 0.2.2
  - type: registry
    identifier: atopile/ti-tlv75901
    release: 0.2.3
  - type: registry
    identifier: atopile/ti-ina232
    release: 0.2.0
  - type: registry
    identifier: atopile/usb-connectors
    release: 0.2.0
  - type: registry
    identifier: atopile/addressable-leds
    release: 0.2.2

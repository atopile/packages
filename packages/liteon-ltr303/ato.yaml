requires-atopile: "^0.10.8"

paths:
  src: ./
  layout: ./layouts

builds:
  default:
    entry: liteon-ltr303.ato:Liteon_LTR303
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]
  usage:
    entry: usage.ato:Usage
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]

package:
  identifier: atopile/liteon-ltr303
  repository: https://github.com/atopile/packages
  homepage: https://github.com/atopile/packages/blob/main/packages/liteon-ltr303/README.md
  version: "0.1.2"
  authors:
    - name: atopile
      email: hi@atopile.io
  summary: "Lite-On; LTR-303ALS-01; Ambient Light Sensor; ALS; I2C; STEMMA; QWIIC"
  license: MIT

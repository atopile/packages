requires-atopile: "^0.12.4"

paths:
  src: ./
  layout: ./layouts

builds:
  default:
    entry: ti-ads7830.ato:TI_ADS7830
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]
  usage:
    entry: usage.ato:Usage
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]

package:
  identifier: atopile/ti-ads7830
  repository: https://github.com/atopile/packages
  homepage: https://github.com/atopile/packages/blob/main/packages/ti-ads7830/README.md
  version: "0.1.1"
  authors:
    - name: atopile
      email: hi@atopile.io
  summary: "Tags: TI; ADS7830; ADC; Analog; Digital; Converter; 8-bit; I2C; 5836; Single-ended; Differential"
  license: MIT

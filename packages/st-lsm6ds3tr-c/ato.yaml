requires-atopile: "^0.10.8"

paths:
  src: ./
  layout: ./layouts

builds:
  default:
    entry: st-lsm6ds3tr-c.ato:ST_LSM6DS3TR_C
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]
  usage:
    entry: usage.ato:Usage
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]

package:
  identifier: atopile/st-lsm6ds3tr-c
  repository: https://github.com/atopile/packages
  homepage: https://github.com/atopile/packages/blob/main/packages/st-lsm6ds3tr-c/README.md
  version: "0.1.0"
  authors:
    - name: atopile
      email: hi@atopile.io
  summary: "Tags: STMicroelectronics; LSM6DS3TR-C; LIS3MDL; 9-DoF; IMU; Accelerometer; Gyroscope; Magnetometer; I2C; SPI; Motion; Orientation; Adafruit; 5543"
  license: MIT

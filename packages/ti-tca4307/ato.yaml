requires-atopile: ^0.14.0

paths:
  src: ./
  layout: ./layouts

builds:
  default:
    entry: ti-tca4307.ato:TI_TCA4307
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]
  usage:
    entry: usage.ato:Usage
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]

package:
  identifier: atopile/ti-tca4307
  repository: https://github.com/atopile/packages
  homepage: https://github.com/atopile/packages/blob/main/packages/ti-tca4307/README.md
  version: 0.2.0
  authors:
    - name: atopile
      email: hi@atopile.io
  summary: "Tags: Texas Instruments; TCA4307; I2C; Buffer; Repeater; Hot-Swap; Bus; Isolation; Level-Shift"
  license: MIT

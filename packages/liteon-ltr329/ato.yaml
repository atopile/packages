requires-atopile: ^0.14.0

paths:
  src: ./
  layout: ./layouts

builds:
  default:
    entry: liteon-ltr329.ato:Liteon_LTR329
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]
  usage:
    entry: usage.ato:Usage
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]

package:
  identifier: atopile/liteon-ltr329
  repository: https://github.com/atopile/packages
  homepage: https://github.com/atopile/packages/blob/main/packages/liteon-ltr329/README.md
  version: "0.2.0"
  authors:
    - name: atopile
      email: hi@atopile.io
  summary: "Lite-On; LTR-329; Ambient Light Sensor; ALS; I2C; STEMMA; QWIIC; Adafruit; 5591"
  license: MIT

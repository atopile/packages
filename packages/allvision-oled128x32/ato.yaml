requires-atopile: ^0.10.8
paths:
  src: .
  layout: ./layouts
builds:
  default:
    entry: allvision-oled128x32.ato:Allvision_OLED12832
    hide_designators: true
    exclude_checks:
    - PCB.requires_drc_check
    exclude_targets:
    - glb
  usage:
    entry: usage.ato:Usage
    hide_designators: true
    exclude_checks:
    - PCB.requires_drc_check
    exclude_targets:
    - glb
package:

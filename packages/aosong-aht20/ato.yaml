requires-atopile: ^0.14.0

paths:
  src: ./
  layout: ./layouts

builds:
  default:
    entry: aosong-aht20.ato:Aosong_AHT20
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]
  usage:
    entry: usage.ato:Usage
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]

package:
  identifier: atopile/aosong-aht20
  repository: https://github.com/atopile/packages
  homepage: https://github.com/atopile/packages/blob/main/packages/aosong-aht20/README.md
  version: "0.2.0"
  authors:
    - name: atopile
      email: hi@atopile.io
  summary: "Aosong; AHT20; Temperature; Humidity; Sensor; I2C; Digital; MEMS; IC; C3012622"
  license: MIT

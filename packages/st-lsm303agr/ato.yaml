requires-atopile: "^0.10.8"

paths:
  src: ./
  layout: ./layouts

builds:
  default:
    entry: st-lsm303agr.ato:ST_LSM303AGR
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]
  usage:
    entry: usage.ato:Usage
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]

package:
  identifier: atopile/st-lsm303agr
  repository: https://github.com/atopile/packages
  homepage: https://github.com/atopile/packages/blob/main/packages/st-lsm303agr/README.md
  version: "0.1.0"
  authors:
    - name: atopile
      email: hi@atopile.io
  summary: "ST; LSM303AGR; Accelerometer; Magnetometer; eCompass; Sensor; IC; I2C; Adafruit; 4413"
  license: MIT

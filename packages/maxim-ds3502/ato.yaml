requires-atopile: "^0.11.6"

paths:
  src: ./
  layout: ./layouts

builds:
  default:
    entry: maxim-ds3502.ato:Maxim_DS3502
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]
  usage:
    entry: usage.ato:Usage
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]

package:
  identifier: atopile/maxim-ds3502
  repository: https://github.com/atopile/packages
  homepage: https://github.com/atopile/packages/blob/main/packages/maxim-ds3502/README.md
  version: "0.1.1"
  authors:
    - name: atopile
      email: hi@atopile.io
  summary: "Maxim; DS3502; Digital Potentiometer; 10kΩ; I2C; Adafruit 4286; 128-Step"
  license: MIT

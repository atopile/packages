requires-atopile: "^0.10.8"

paths:
  src: ./
  layout: ./layouts

builds:
  default:
    entry: microchip-mcp9808.ato:Microchip_MCP9808
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]
  usage:
    entry: usage.ato:Usage
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]

package:
  identifier: atopile/microchip-mcp9808
  repository: https://github.com/atopile/packages
  homepage: https://github.com/atopile/packages/blob/main/packages/microchip-mcp9808/README.md
  version: "0.1.0"
  authors:
    - name: atopile
      email: hi@atopile.io
  summary: "Tags: Microchip; MCP9808; Temperature; Sensor; IC; I2C; Adafruit; 5027; High Precision; Digital"
  license: MIT

requires-atopile: "^0.9.0"

paths:
  src: "."
  layout: ./layouts

builds:
  default:
    entry: sk6805-ec20.ato:SK6805EC20_driver
  test:
    entry: sk6805-ec20.ato:Test
    exclude_checks: ['PCB.requires_drc_check']
  sk6805-side:
    entry: sk6805-side.ato:SK6805Side_driver
  test-side:
    entry: sk6805-side.ato:Test
    exclude_checks: ['PCB.requires_drc_check']

package:
  identifier: atopile/addressable-leds
  repository: https://github.com/atopile/packages
  version: "0.2.6"
  authors:
    - name: atopile
      email: hi@atopile.io
  summary: SK6805 addressable RGB LEDs with integrated controller for creating colorful LED effects and animations
  license: MIT

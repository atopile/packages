requires-atopile: ^0.14.0

paths:
  src: ./
  layout: ./layouts

builds:
  default:
    entry: sensirion-sht41.ato:Sensirion_SHT41
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]
  usage:
    entry: usage.ato:Usage
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]

package:
  identifier: atopile/sensirion-sht41
  repository: https://github.com/atopile/packages
  homepage: https://github.com/atopile/packages/blob/main/packages/sensirion-sht41/README.md
  version: "0.2.0"
  authors:
    - name: atopile
      email: hi@atopile.io
  summary: "Sensirion; SHT41; Temperature; Humidity; Sensor; I2C; Digital; MEMS; IC; C7461863"
  license: MIT

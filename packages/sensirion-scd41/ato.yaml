requires-atopile: "^0.10.8"

paths:
  src: ./
  layout: ./layouts

builds:
  default:
    entry: sensirion-scd41.ato:Sensirion_SCD41
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]
  usage:
    entry: usage.ato:Usage
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]

package:
  identifier: atopile/sensirion-scd41
  repository: https://github.com/atopile/packages
  homepage: https://github.com/atopile/packages/blob/main/packages/sensirion-scd41/README.md
  version: "0.1.1"
  authors:
    - name: atopile
      email: hi@atopile.io
  summary: "Tags: Sensirion; SCD41; CO2; Carbon; Dioxide; Sensor; Temperature; Humidity; I2C; Environmental; NDIR; Photoacoustic"
  license: MIT

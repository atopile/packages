requires-atopile: "^0.10.8"

paths:
  src: ./
  layout: ./layouts

builds:
  default:
    entry: liteon-ltr390uv.ato:Liteon_LTR390UV
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]
  usage:
    entry: usage.ato:Usage
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]

package:
  identifier: atopile/liteon-ltr390uv
  repository: https://github.com/atopile/packages
  homepage: https://github.com/atopile/packages/blob/main/packages/liteon-ltr390uv/README.md
  version: "0.1.1"
  authors:
    - name: atopile
      email: hi@atopile.io
  summary: "Lite-On; LTR-390UV; UV Sensor; I2C; STEMMA; QWIIC; Adafruit; 4831"
  license: MIT

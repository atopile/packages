requires-atopile: "^0.14.0"
paths:
  src: ./
  layout: ./layouts
builds:
  default:
    entry: ti-opt3001.ato:TI_OPT3001
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]
  usage:
    entry: usage.ato:Usage
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]
package:
  identifier: atopile/ti-opt3001
  repository: https://github.com/atopile/packages
  homepage: https://github.com/atopile/packages/blob/main/packages/ti-opt3001/README.md
  version: "0.1.0"
  authors:
    - name: laurapineroroig
      email: ""
  summary: "Tags: Texas Instruments; TI; OPT3001; Ambient Light; Lux; Sensor; I2C; USON-6; C90462"
  license: MIT

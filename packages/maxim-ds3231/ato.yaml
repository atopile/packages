requires-atopile: "^0.10.8"

paths:
  src: "./"
  layout: ./layouts

builds:
  default:
    entry: maxim-ds3231.ato:Maxim_DS3231
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]
  usage:
    entry: usage.ato:Usage
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]

package:
  identifier: atopile/maxim-ds3231
  repository: https://github.com/atopile/packages
  homepage: https://github.com/atopile/packages/blob/main/packages/maxim-ds3231/README.md
  authors:
    - name: atopile
      email: hi@atopile.io
  version: "0.1.0"
  summary: Maxim Integrated DS3231; RTC; I2C; Temperature compensated; Crystal; Clock; SQW; STEMMA; Adafruit; 5188
  license: MIT

requires-atopile: ^0.12.4

paths:
  src: .
  layout: ./layouts

builds:
  default:
    entry: adi-ad1938.ato:Analog_Devices_AD1938_driver
    hide_designators: true
    exclude_checks: [PCB.requires_drc_check]
  usage:
    entry: usage.ato:Usage
    hide_designators: true
    exclude_checks: [PCB.requires_drc_check]

package:
  identifier: atopile/adi-ad1938
  repository: https://github.com/atopile/packages
  homepage: https://github.com/atopile/packages/blob/main/packages/adi-ad1938/README.md
  version: 0.1.2
  authors:
    - name: atopile
      email: hi@atopile.io
  summary: Analog Devices AD1938 24-bit, 192 kHz Stereo ADC/DAC; RS485; 485;
  license: MIT

requires-atopile: "^0.9.0"

paths:
  src: .
  layout: ./layouts

builds:
  default:
    entry: RP2040.ato:RP2040_driver
    exclude_checks: ['PCB.requires_drc_check']
  example:
    entry: RP2040.ato:Example
    exclude_checks: ['PCB.requires_drc_check']

package:
  identifier: atopile/rp2040
  repository: https://github.com/atopile/packages
  version: "0.1.5"
  authors:
    - name: atopile
      email: hi@atopile.io
  summary: The RP2040 microcontroller from RaspberryPi
  license: MIT

dependencies:
  - type: registry
    identifier: atopile/buttons
    release: 0.2.2

requires-atopile: ^0.14.0

paths:
  src: ./
  layout: ./layouts

builds:
  default:
    entry: raspberry-rp2040.ato:Raspberry_Pi_RP2040
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]
  usage:
    entry: usage.ato:Usage
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]

package:
  identifier: atopile/raspberry-rp2040
  repository: https://github.com/atopile/packages
  homepage: https://github.com/atopile/packages/blob/main/packages/raspberry-rp2040/README.md
  version: "0.4.0"
  authors:
    - name: atopile
      email: hi@atopile.io
  summary: Raspberry Pi; RP2040; Microcontroller; Dual-Core; ARM; Cortex-M0+; USB; SPI; I2C; UART
  license: MIT
dependencies:
- type: registry
  identifier: atopile/st-ldk220
  release: 0.2.3

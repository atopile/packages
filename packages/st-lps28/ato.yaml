requires-atopile: ^0.14.0

paths:
  src: ./
  layout: ./layouts

builds:
  default:
    entry: st-lps28.ato:ST_LPS28
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]
  usage:
    entry: usage.ato:Usage
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]

package:
  identifier: atopile/st-lps28
  repository: https://github.com/atopile/packages
  homepage: https://github.com/atopile/packages/blob/main/packages/st-lps28/README.md
  version: "0.3.1"
  authors:
    - name: atopile
      email: hi@atopile.io
  summary: "Tags: ST; LPS28; Pressure; Sensor; IC; I2C; SPI; C3263277; STMicroelectronics; MEMS"
  license: MIT

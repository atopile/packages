requires-atopile: "^0.10.8"

paths:
  src: "."
  layout: ./layouts

builds:
  default:
    entry: sensirion-scd40.ato:Sensirion_SCD40
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]
  usage:
    entry: usage.ato:Usage
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]

package:
  identifier: atopile/sensirion-scd40
  repository: https://github.com/atopile/packages
  homepage: https://github.com/atopile/packages/blob/main/packages/sensirion-scd40/README.md
  version: "0.1.0"
  authors:
    - name: atopile
      email: hi@atopile.io
  summary: Sensirion; SCD40; CO2; Temperature; Humidity; I²C; Adafruit; 5187; QWIIC; STEMMA
  license: MIT

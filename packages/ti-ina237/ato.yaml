  version: "0.1.2"
  authors:
    - name: atopile
      email: hi@atopile.io
  summary: "Tags: TI; INA237; Current; Voltage; Power; Monitor; Sensor; IC; I2C; Adafruit; 6340; C2864837; 85V; 16-bit; ADC"
  license: MIT

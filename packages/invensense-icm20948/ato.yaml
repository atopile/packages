requires-atopile: "^0.10.8"

paths:
  src: ./
  layout: ./layouts

builds:
  default:
    entry: icm20948.ato:ICM20948_driver
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]
  usage:
    entry: usage.ato:Usage
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]

package:
  identifier: atopile/invensense-icm20948
  repository: https://github.com/atopile/packages
  homepage: https://github.com/atopile/packages/blob/main/packages/invensense-icm20948/README.md
  version: "0.1.0"
  authors:
    - name: atopile
      email: hi@atopile.io
  summary: Invensense; ICM20948; 9-axis; IMU; Sensor; IC; I2C; SPI; Adafruit; 4554
  license: MIT

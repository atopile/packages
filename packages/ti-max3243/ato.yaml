requires-atopile: "^0.10.8"

paths:
  src: "./"
  layout: ./layouts

builds:
  default:
    entry: ti-max3243.ato:TI_MAX3243
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]
  usage:
    entry: usage.ato:Usage
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]

package:
  identifier: atopile/ti-max3243
  repository: https://github.com/atopile/packages
  homepage: https://github.com/atopile/packages/blob/main/packages/ti-max3243/README.md
  authors:
    - name: atopile
      email: hi@atopile.io
  version: "0.1.0"
  summary: Texas Instruments MAX3243; RS232; Line Driver; Receiver; UART; Serial; Communication; Adafruit; 5988
  license: MIT

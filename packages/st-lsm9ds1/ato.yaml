requires-atopile: ^0.14.0

paths:
  src: ./
  layout: ./layouts

builds:
  default:
    entry: st-lsm9ds1.ato:ST_LSM9DS1
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]
  usage:
    entry: usage.ato:Usage
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]

package:
  identifier: atopile/st-lsm9ds1
  repository: https://github.com/atopile/packages
  homepage: https://github.com/atopile/packages/blob/main/packages/st-lsm9ds1/README.md
  version: "0.2.0"
  authors:
    - name: atopile
      email: hi@atopile.io
  summary: "Tags: STMicroelectronics; LSM9DS1; 9-DOF; IMU; Accelerometer; Gyroscope; Magnetometer; Sensor; IC; I2C; SPI; Adafruit; 4634; QWIIC; STEMMA"
  license: MIT

requires-atopile: ^0.10.5

paths:
  src: .
  layout: ./layouts

builds:
  bq25185_driver:
    entry: ti-bq25185.ato:BQ25185_driver
    exclude_checks: ['PCB.requires_drc_check']
  bq25185_example:
    entry: ti-bq25185.ato:BQ25185_example
    hide_designators: true
    exclude_checks: ['PCB.requires_drc_check']

package:
  identifier: atopile/ti-bq25185
  repository: https://github.com/atopile/packages
  version: 0.1.0
  authors:
    - name: atopile
      email: hi@atopile.io
  summary: BQ25185 1A, single-input, single-cell linear battery charger with
    power path, factory mode, and battery tracking
  license: MIT
dependencies:
  - type: registry
    identifier: atopile/buttons
    release: 0.2.2

requires-atopile: ^0.9.0

paths:
  src: .
  layout: ./layouts

builds:
  default:
    entry: st-stusb4500.ato:STUSB4500
    exclude_checks: [PCB.requires_drc_check]
    hide_designators: true
  usage:
    entry: usage.ato:Usage
    exclude_checks: [PCB.requires_drc_check]
    hide_designators: true

package:
  identifier: atopile/st-stusb4500
  repository: https://github.com/atopile/packages
  version: 0.1.5
  authors:
  - name: atopile
    email: hi@atopile.io
  summary: STUSB4500 USB PD controller 5A 20V
  license: MIT
dependencies:
- type: registry
  identifier: atopile/usb-connectors
  release: 0.3.2

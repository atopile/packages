requires-atopile: ^0.14.0

paths:
  src: .
  layout: ./layouts

builds:
  stusb4500-usbc-connector:
    entry: st-stusb4500.ato:STUSB4500_USBC_Connector
    exclude_checks: [PCB.requires_drc_check]
    hide_designators: true
  default:
    entry: st-stusb4500.ato:STUSB4500_driver
    exclude_checks: [PCB.requires_drc_check]
    hide_designators: true
  usage:
    entry: usage.ato:Usage
    exclude_checks: [PCB.requires_drc_check]
    hide_designators: true

package:
  identifier: atopile/st-stusb4500
  repository: https://github.com/atopile/packages
  homepage:
    https://github.com/atopile/packages/blob/main/packages/st-stusb4500/README.md
  version: 0.3.1
  authors:
  - name: atopile
    email: hi@atopile.io
  summary: STUSB4500 USB PD controller 5A 20V
  license: MIT
dependencies:
- type: registry
  identifier: atopile/usb-connectors
  release: 0.4.1

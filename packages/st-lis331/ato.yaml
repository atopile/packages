requires-atopile: "^0.12.4"

paths:
  src: ./
  layout: ./layouts

builds:
  default:
    entry: st-lis331.ato:ST_LIS331
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]
  usage:
    entry: usage.ato:Usage
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]

package:
  identifier: atopile/st-lis331
  repository: https://github.com/atopile/packages
  homepage: https://github.com/atopile/packages/blob/main/packages/st-lis331/README.md
  version: "0.1.1"
  authors:
    - name: atopile
      email: hi@atopile.io
  summary: STMicroelectronics; LIS331DLH; Triple-Axis; Accelerometer; Digital; ±2g; ±4g; ±8g; Sensor; IC; I2C; SPI; Adafruit; 4626; STEMMA; QWIIC
  license: MIT

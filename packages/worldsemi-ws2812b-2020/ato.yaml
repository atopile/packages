requires-atopile: "^0.12.4"

paths:
  src: ./
  layout: ./layouts

builds:
  default:
    entry: worldsemi-ws2812b-2020.ato:Worldsemi_WS2812B_2020
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]
  strip:
    entry: worldsemi-ws2812b-2020.ato:WS2812B_2020_HighDensity_Strip
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]
  matrix:
    entry: worldsemi-ws2812b-2020.ato:WS2812B_2020_Matrix
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]
  usage:
    entry: usage.ato:Usage
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]

package:
  identifier: atopile/worldsemi-ws2812b-2020
  repository: https://github.com/atopile/packages
  homepage: https://github.com/atopile/packages/blob/main/packages/worldsemi-ws2812b-2020/README.md
  version: "0.1.1"
  authors:
    - name: atopile
      email: hi@atopile.io
  summary: "Tags: Worldsemi; WS2812B; RGB; LED; Addressable; Digital; Strip; NeoPixel; 2020; SMD2020; Compact; C965555"
  license: MIT

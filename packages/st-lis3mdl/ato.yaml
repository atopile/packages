requires-atopile: ^0.14.0

paths:
  src: ./
  layout: ./layouts

builds:
  default:
    entry: st-lis3mdl.ato:ST_LIS3MDL
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]
  usage:
    entry: usage.ato:Usage
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]

package:
  identifier: atopile/st-lis3mdl
  repository: https://github.com/atopile/packages
  homepage: https://github.com/atopile/packages/blob/main/packages/st-lis3mdl/README.md
  version: "0.2.0"
  authors:
    - name: atopile
      email: hi@atopile.io
  summary: "STMicroelectronics; LIS3MDL; 3-axis; Magnetometer; Sensor; IC; I2C; SPI; C478483"
  license: MIT

requires-atopile: "^0.10.8"

paths:
  src: "."
  layout: ./layouts

builds:
  default:
    entry: st-lsm6ds3.ato:ST_LSM6DS3
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]
  usage:
    entry: usage.ato:Usage
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]

package:
  identifier: atopile/st-lsm6ds3
  repository: https://github.com/atopile/packages
  homepage: https://github.com/atopile/packages/blob/main/packages/st-lsm6ds3/README.md
  version: "0.1.1"
  authors:
    - name: atopile
      email: hi@atopile.io
  summary: "ST; LSM6DS3; Accelerometer; Gyroscope; 6-axis; IMU; Adafruit; 4626; I2C"
  license: MIT

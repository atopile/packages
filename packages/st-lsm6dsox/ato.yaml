requires-atopile: ^0.14.0

paths:
  src: ./
  layout: ./layouts

builds:
  default:
    entry: st-lsm6dsox.ato:ST_LSM6DSOX
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]
  usage:
    entry: usage.ato:Usage
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]

package:
  identifier: atopile/st-lsm6dsox
  repository: https://github.com/atopile/packages
  homepage: https://github.com/atopile/packages/blob/main/packages/st-lsm6dsox/README.md
  version: "0.2.0"
  authors:
    - name: atopile
      email: hi@atopile.io
  summary: "STMicroelectronics; LSM6DSOX; Accelerometer; Gyroscope; 6-axis; IMU; Sensor; IC; I2C; SPI; Adafruit; 4438; QWIIC; STEMMA"
  license: MIT

requires-atopile: ^0.14.0

paths:
  src: ./
  layout: ./layouts

builds:
  default:
    entry: lattice-ecp5.ato:Lattice_ECP5_driver
    hide_designators: true
    exclude_checks: [PCB.requires_drc_check]
  usage:
    entry: logic-analyzer.ato:Logic_Analyzer
    hide_designators: true
    exclude_checks: [PCB.requires_drc_check]

package:
  identifier: atopile/lattice-ecp5
  repository: https://github.com/atopile/packages
  homepage:
  version: 0.0.1
  authors:
  - name: atopile
    email: hi@atopile.io
  summary: TBD
  license: MIT
dependencies:
- type: registry
  identifier: atopile/ti-tlv75901
  release: 0.4.0
- type: registry
  identifier: atopile/programming-headers
  release: 0.2.0
- type: registry
  identifier: atopile/st-stm32h723
  release: 0.1.2
- type: registry
  identifier: atopile/microchip-lan8742a
  release: 0.3.0
- type: registry
  identifier: atopile/rj45-connectors
  release: 0.2.0
- type: registry

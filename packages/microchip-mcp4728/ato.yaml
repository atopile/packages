requires-atopile: "^0.10.8"

paths:
  src: ./
  layout: ./layouts

builds:
  default:
    entry: microchip-mcp4728.ato:Microchip_MCP4728
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]
  usage:
    entry: usage.ato:Usage
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]

package:
  identifier: atopile/microchip-mcp4728
  repository: https://github.com/atopile/packages
  homepage: https://github.com/atopile/packages/blob/main/packages/microchip-mcp4728/README.md
  version: "0.1.0"
  authors:
    - name: atopile
      email: hi@atopile.io
  summary: "Tags: Microchip; MCP4728; DAC; Digital-to-Analog Converter; 12-bit; Quad; EEPROM; I2C; Adafruit; 4470"
  license: MIT

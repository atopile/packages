  repository: https://github.com/atopile/packages
  homepage: https://github.com/atopile/packages/blob/main/packages/adi-ds2482s-800/README.md
  version: "0.1.0"
  authors:
    - name: atopile
      email: hi@atopile.io
  summary: "Tags: Analog Devices; ADI; Maxim; DS2482S-800; 8 Channel; I2C; 1-Wire; Bus Adapter; IC; Adafruit; 6027; Bridge; Interface"
  license: MIT

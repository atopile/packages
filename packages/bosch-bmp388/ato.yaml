requires-atopile: ^0.14.0
paths:
  src: ./
  layout: ./layouts
builds:
  default:
    entry: bosch-bmp388.ato:Bosch_BMP388
    hide_designators: true
    exclude_checks:
    - PCB.requires_drc_check
  usage:
    entry: usage.ato:Usage
    hide_designators: true
    exclude_checks:
    - PCB.requires_drc_check
package:
  identifier: atopile/bosch-bmp388
  repository: https://github.com/atopile/packages
  homepage: https://github.com/atopile/packages/blob/main/packages/bosch-bmp388/README.md
  version: 0.2.1
  authors:
  - name: atopile
    email: hi@atopile.io
  summary: Bosch; BMP388; Temperature; Pressure; Sensor; IC; I2C; SPI; Adafruit; 3966;
    QWIIC; STEMMA
  license: MIT

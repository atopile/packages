requires-atopile: "^0.10.8"

paths:
  src: ./
  layout: ./layouts

builds:
  default:
    entry: maxim-ds1841.ato:Maxim_DS1841
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]
  usage:
    entry: usage.ato:Usage
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]

package:
  identifier: atopile/maxim-ds1841
  repository: https://github.com/atopile/packages
  homepage: https://github.com/atopile/packages/blob/main/packages/maxim-ds1841/README.md
  version: "0.1.0"
  authors:
    - name: atopile
      email: hi@atopile.io
  summary: "Maxim; DS1841; Digital Potentiometer; Logarithmic; 22kΩ; 3.7kΩ; I2C; Adafruit 4570; 128-Step"
  license: MIT

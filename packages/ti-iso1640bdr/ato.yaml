requires-atopile: "^0.9.0"

paths:
  src: "."
  layout: ./layouts

builds:
  default:
    entry: ti-iso1640bdr.ato:TI_ISO1640BDR
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]
  usage:
    entry: usage.ato:Example
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]

package:
  identifier: atopile/ti-iso1640bdr
  repository: https://github.com/atopile/packages
  version: "0.1.0"
  authors:
    - name: atopile
      email: hi@atopile.io
  summary: Texas Instruments ISO1640BDR
  license: MIT

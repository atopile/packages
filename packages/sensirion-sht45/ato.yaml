requires-atopile: "^0.10.8"

paths:
  src: ./
  layout: ./layouts

builds:
  default:
    entry: sensirion-sht45.ato:Sensirion_SHT45
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]
  usage:
    entry: usage.ato:Usage
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]

package:
  identifier: atopile/sensirion-sht45
  repository: https://github.com/atopile/packages
  homepage: https://github.com/atopile/packages/blob/main/packages/sensirion-sht45/README.md
  version: "0.1.0"
  authors:
    - name: atopile
      email: hi@atopile.io
  summary: "Sensirion; SHT45; Temperature; Humidity; Sensor; I2C; Digital; MEMS; IC; C5360602"
  license: MIT

requires-atopile: "^0.12.4"

paths:
  src: ./
  layout: ./layouts

# Ensure the project has at least a default build and a usage build
builds:
  default:
    entry: batteries.ato:Battery
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]
  usage:
    entry: usage.ato:Usage
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]
  eemb_battery_lp402535_driver:
    entry: eemb_battery_lp402535.ato:EMB_BATTERY_LP402535_driver
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]

package:
  identifier: atopile/batteries
  repository: https://github.com/atopile/packages
  homepage: https://github.com/atopile/packages/blob/main/packages/batteries/README.md
  version: "0.2.2"
  authors:
    - name: atopile
      email: hi@atopile.io
  summary: "Tags: Battery; Primary; Secondary; Lithium-ion; Power; Energy; Storage; EEMB; LP402535; Molex; Connector"
  license: MIT

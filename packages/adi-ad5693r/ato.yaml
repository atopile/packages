requires-atopile: "^0.11.5"

paths:
  src: ./
  layout: ./layouts

builds:
  default:
    entry: adi-ad5693r.ato:ADI_AD5693R
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]
  usage:
    entry: usage.ato:Usage
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]

package:
  identifier: atopile/adi-ad5693r
  repository: https://github.com/atopile/packages
  homepage: https://github.com/atopile/packages/blob/main/packages/adi-ad5693r/README.md
  version: "0.1.3"
  authors:
    - name: atopile
      email: hi@atopile.io
  summary: "Tags: ADI; AD5693R; DAC; 16-bit; I2C; Digital-to-Analog; Breakout; Adafruit; 5811; Analog Devices"
  license: MIT

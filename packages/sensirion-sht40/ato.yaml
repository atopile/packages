requires-atopile: "^0.10.8"

paths:
  src: ./
  layout: ./layouts

builds:
  default:
    entry: sensirion-sht40.ato:Sensirion_SHT40
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]
  usage:
    entry: usage.ato:Usage
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]

package:
  identifier: atopile/sensirion-sht40
  repository: https://github.com/atopile/packages
  homepage: https://github.com/atopile/packages/blob/main/packages/sensirion-sht40/README.md
  version: "0.1.0"
  authors:
    - name: atopile
      email: hi@atopile.io
  summary: "Tags: Sensirion; SHT40; Temperature; Humidity; Sensor; I2C; DFN-4; Digital; C2848306"
  license: MIT

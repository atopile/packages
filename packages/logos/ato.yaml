requires-atopile: "^0.11.4"

paths:
  src: "."
  layout: ./layouts

builds:
  default:
    entry: logos.ato:atopile_logo_4x4mm
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]
  usage:
    entry: usage.ato:Usage
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]
  faebryk_logo_8x9mm:
    entry: logos.ato:faebryk_logo_8x9mm
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]
  atopile_logo_8x8mm:
    entry: logos.ato:atopile_logo_8x8mm
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]
  atopile_logo_4x4mm:
    entry: logos.ato:atopile_logo_4x4mm
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]
  atopile_logo_25x25mm:
    entry: logos.ato:atopile_logo_25x25mm
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]
  atopile_logo_25x6mm:
    entry: logos.ato:atopile_logo_25x6mm
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]

package:
  identifier: atopile/logos
  repository: https://github.com/atopile/packages
  version: "0.1.4"
  authors:
    - name: atopile
      email: hi@atopile.com
  summary: Various atopile logos
  license: MIT

requires-atopile: "^0.10.8"

paths:
  src: "."
  layout: ./layouts

builds:
  default:
    entry: ti-lv284x.ato:_TI_LV284XX
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]

  usage:
    entry: usage.ato:Usage
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]


package:
  identifier: atopile/ti-lv284x
  repository: https://github.com/atopile/packages
  version: "0.1.6"
  authors:
    - name: atopile
      email: hi@atopile.io
  summary: LV284 High-Efficiency, Wide, Input-Voltage-Range (4-40V) Buck Regulator
  license: MIT

requires-atopile: ^0.14.0

paths:
  src: ./
  layout: ./layouts

builds:
  dev-board:
    entry: trinamic-tmc5160-dev-board.ato:Trinamic_TMC5160_Dev_Board
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]
  default:
    entry: trinamic-tmc5160.ato:Trinamic_TMC5160
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]
  usage:
    entry: usage.ato:Usage
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]

package:
  identifier: atopile/trinamic-tmc5160
  repository: https://github.com/atopile/packages
  homepage: https://github.com/atopile/packages/blob/main/packages/trinamic-tmc5160/README.md
  version: "0.2.0"
  authors:
    - name: atopile
      email: hi@atopile.io
  summary: "Tags: Trinamic; TMC5160; Stepper Motor Driver; SPI; Motion Control; IC; Driver; C516354"
  license: MIT

requires-atopile: "^0.11.4"

paths:
  src: ./
  layout: ./layouts

builds:
  default:
    entry: bosch-bme680.ato:Bosch_BME680
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]
  usage:
    entry: usage.ato:Usage
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]

package:
  identifier: atopile/bosch-bme680
  repository: https://github.com/atopile/packages
  homepage: https://github.com/atopile/packages/blob/main/packages/bosch-bme680/README.md
  version: "0.1.0"
  authors:
    - name: atopile
      email: hi@atopile.io
  summary: "Tags: Bosch; BME680; Temperature; Humidity; Pressure; Gas; Sensor; IC; I2C; SPI; Adafruit; 3660; Environmental; VOC; Air Quality"
  license: MIT

requires-atopile: ^0.14.0

paths:
  src: "."
  layout: ./layouts

builds:
  default:
    entry: saleae-header.ato:SaleaeHeader
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]
  rightangle-2:
    entry: saleae-header.ato:SaleaeHeaderRightAngle_2
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]
  vertical:
    entry: saleae-header.ato:SaleaeHeaderVertical
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]
  rightangle:
    entry: saleae-header.ato:SaleaeHeaderRightAngle
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]
  rightangle-1:
    entry: saleae-header.ato:SaleaeHeaderRightAngle_1
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]
  rightangle-4:
    entry: saleae-header.ato:SaleaeHeaderRightAngle_4
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]
  usage:
    entry: usage.ato:Usage
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]

package:
  identifier: atopile/saleae-header
  repository: https://github.com/atopile/packages
  version: "0.3.0"
  authors:
    - name: atopile
      email: hi@atopile.io
  summary: Saleae header for debugging convenience
  license: MIT

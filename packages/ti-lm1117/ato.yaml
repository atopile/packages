requires-atopile: "^0.14.0"

paths:
  src: .
  layout: ./layouts

builds:
  default:
    entry: ti-lm1117.ato:TI_LM1117
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]
  usage:
    entry: usage.ato:Usage
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]

package:
  identifier: atopile/ti-lm1117
  repository: https://github.com/atopile/packages
  homepage: https://github.com/atopile/packages/blob/main/packages/ti-lm1117/README.md
  version: "0.1.0"
  authors:
    - name: atopile
      email: hi@atopile.io
  summary: "Tags: Texas Instruments; TI; LM1117; LDO; Linear Regulator; 3.3V; 800mA; SOT-223"
  license: MIT

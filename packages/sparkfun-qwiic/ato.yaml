requires-atopile: "^0.10.8"

paths:
  src: "."
  layout: ./layouts

builds:
  default:
    entry: sparkfun-qwiic.ato:QwiicHorizontal
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]
  usage:
    entry: usage.ato:Usage
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]

package:
  identifier: atopile/sparkfun-qwiic
  repository: https://github.com/atopile/packages
  homepage: https://github.com/atopile/packages/blob/main/packages/sparkfun-qwiic/README.md
  version: "0.1.0"
  authors:
    - name: atopile
      email: hi@atopile.io
  summary: Sparkfun; QWIIC; STEMMA; I²C;
  license: MIT

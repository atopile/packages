requires-atopile: ^0.14.0

paths:
  src: ./
  layout: ./layouts

builds:
  default:
    entry: st-hts221.ato:ST_HTS221
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]
  usage:
    entry: usage.ato:Usage
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]

package:
  identifier: atopile/st-hts221
  repository: https://github.com/atopile/packages
  homepage: https://github.com/atopile/packages/blob/main/packages/st-hts221/README.md
  version: "0.2.1"
  authors:
    - name: atopile
      email: hi@atopile.io
  summary: "Tags: STMicroelectronics; HTS221; Temperature; Humidity; Sensor; IC; I2C; Adafruit; 4535; Digital; Capacitive"
  license: MIT

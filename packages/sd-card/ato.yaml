requires-atopile: ^0.9.0

paths:
  src: .
  layout: ./layouts

builds:
  usd-assembly:
    entry: main.ato:SDCardAssemblyWithRemovableMicroSDWithSPI
    hide-designators: true
    exclude_checks: ["PCB.requires_drc_check"]

package:
  identifier: atopile/sd-card
  repository: https://github.com/atopile/packages
  version: 0.1.7
  authors:
    - name: atopile
      email: hi@atopile.io
  summary: SD and microSD card, SD, SDHC, SDXC, SDUC
  license: MIT

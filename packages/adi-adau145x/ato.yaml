requires-atopile: "^0.10.0"

paths:
  src: "."
  layout: ./layouts

builds:
  example:
    entry: example.ato:Example
    exclude_checks: ['PCB.requires_drc_check']
  default:
    entry: adau145x.ato:Analog_Devices_ADAU145x_driver
    exclude_checks: ['PCB.requires_drc_check']

package:
  identifier: atopile/adi-adau145x
  repository: https://github.com/atopile/packages
  version: "0.1.5"
  authors:
    - name: atopile
      email: hi@atopile.io
  summary: Analog Devices ADAU 145x Family (1452, 1451, 1450)
  license: MIT

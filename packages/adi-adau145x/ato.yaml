requires-atopile: ^0.12.4

paths:
  src: ./
  layout: ./layouts

builds:
  default:
    entry: adi-adau145x.ato:ADI_ADAU145x
    hide_designators: true
    exclude_checks: [PCB.requires_drc_check]
  usage:
    entry: usage.ato:Usage
    hide_designators: true
    exclude_checks: [PCB.requires_drc_check]

package:
  identifier: atopile/adi-adau145x
  repository: https://github.com/atopile/packages
  version: 0.1.6
  authors:
  - name: atopile
    email: hi@atopile.io
  summary: Analog Devices ADAU 145x Family (1452, 1451, 1450)
  license: MIT
dependencies:
- type: file
  identifier: atopile/validation-pogo
  path: ../validation-pogo
- type: registry
  identifier: atopile/logos
  release: 0.1.5

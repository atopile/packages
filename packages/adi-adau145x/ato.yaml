requires-atopile: ^0.14.0

paths:
  src: ./
  layout: ./layouts

builds:
  default:
    entry: adi-adau145x.ato:ADI_ADAU145x
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]
  usage:
    entry: usage.ato:Usage
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]

package:
  identifier: atopile/adi-adau145x
  repository: https://github.com/atopile/packages
  version: "0.2.0"
  authors:
    - name: atopile
      email: hi@atopile.io
  summary: Analog Devices ADAU 145x Family (1452, 1451, 1450)
  license: MIT

requires-atopile: "^0.12.4"

paths:
  src: ./
  layout: ./layouts

builds:
  default:
    entry: st-lsm6dsox-lis3mdl.ato:ST_LSM6DSOX_LIS3MDL
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]
  usage:
    entry: usage.ato:Usage
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]

package:
  identifier: atopile/st-lsm6dsox-lis3mdl
  repository: https://github.com/atopile/packages
  homepage: https://github.com/atopile/packages/blob/main/packages/st-lsm6dsox-lis3mdl/README.md
  version: "0.1.1"
  authors:
    - name: atopile
      email: hi@atopile.io
  summary: "Tags: STMicroelectronics; LSM6DSOX; LIS3MDL; 9DoF; IMU; Accelerometer; Gyroscope; Magnetometer; I2C; Adafruit; 4517; STEMMA; QT; Qwiic"

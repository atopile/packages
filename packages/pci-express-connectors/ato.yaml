requires-atopile: "^0.11.5"

paths:
  src: ./
  layout: ./layouts

builds:
  default:
    entry: pci-express-connectors.ato:PCIe_X1_Edge
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]
  x1_edge:
    entry: pci-express-connectors.ato:PCIe_X1_Edge
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]
  x4_edge:
    entry: pci-express-connectors.ato:PCIe_X4_Edge
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]
  x8_edge:
    entry: pci-express-connectors.ato:PCIe_X8_Edge
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]
  x16_edge:
    entry: pci-express-connectors.ato:PCIe_X16_Edge
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]
  x1_socket:
    entry: pci-express-connectors.ato:PCIe_X1_Socket
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]
  x4_socket:
    entry: pci-express-connectors.ato:PCIe_X4_Socket
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]
  x8_socket:
    entry: pci-express-connectors.ato:PCIe_X8_Socket
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]
  x16_socket:
    entry: pci-express-connectors.ato:PCIe_X16_Socket
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]
  usage:
    entry: usage.ato:Usage
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]

package:
  identifier: atopile/pci-express-connectors
  repository: https://github.com/atopile/packages
  homepage: https://github.com/atopile/packages/blob/main/packages/pci-express-connectors/README.md
  version: "0.1.0"
  authors:
    - name: atopile
      email: hi@atopile.io
  summary: "Tags: PCI; PCIe; PCI Express; Board Edge; Connector; x1; x4; x8; x16; High Speed; Differential; Computer; Expansion"
  license: MIT

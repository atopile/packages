requires-atopile: "^0.11.5"

paths:
  src: ./
  layout: ./layouts

builds:
  default:
    entry: pci-express-connectors.ato:PCIe_X1
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]
  x1:
    entry: pci-express-connectors.ato:PCIe_X1
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]
  x4:
    entry: pci-express-connectors.ato:PCIe_X4
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]
  x8:
    entry: pci-express-connectors.ato:PCIe_X8
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]
  x16:
    entry: pci-express-connectors.ato:PCIe_X16
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]
  usage:
    entry: usage.ato:Usage
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]

package:
  identifier: atopile/pci-express-connectors
  repository: https://github.com/atopile/packages
  homepage: https://github.com/atopile/packages/blob/main/packages/pci-express-connectors/README.md
  version: "0.1.0"
  authors:
    - name: atopile
      email: hi@atopile.io
  summary: "Tags: PCI; PCIe; PCI Express; Board Edge; Connector; x1; x4; x8; x16; High Speed; Differential; Computer; Expansion"
  license: MIT

requires-atopile: "^0.12.4"

paths:
  src: ./
  layout: ./layouts

builds:
  default:
    entry: worldsemi-ws2812c.ato:Worldsemi_WS2812C
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]
  strip:
    entry: worldsemi-ws2812c.ato:WS2812C_Strip
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]
  matrix:
    entry: worldsemi-ws2812c.ato:WS2812C_Matrix
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]
  usage:
    entry: usage.ato:Usage
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]

package:
  identifier: atopile/worldsemi-ws2812c-5050
  repository: https://github.com/atopile/packages
  homepage: https://github.com/atopile/packages/blob/main/packages/worldsemi-ws2812c-5050/README.md
  version: "0.1.1"
  authors:
    - name: atopile
      email: hi@atopile.io
  summary: "Tags: Worldsemi; WS2812C; RGB; LED; Addressable; Digital; Strip; NeoPixel; 5050; SMD5050; C114587"
  license: MIT

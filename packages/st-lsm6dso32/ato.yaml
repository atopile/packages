requires-atopile: "^0.10.8"

paths:
  src: ./
  layout: ./layouts

builds:
  default:
    entry: st-lsm6dso32.ato:ST_LSM6DSO32
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]
  usage:
    entry: usage.ato:Usage
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]

package:
  identifier: atopile/st-lsm6dso32
  repository: https://github.com/atopile/packages
  homepage: https://github.com/atopile/packages/blob/main/packages/st-lsm6dso32/README.md
  version: "0.1.2"
  authors:
    - name: atopile
      email: hi@atopile.io
  summary: "STMicroelectronics; LSM6DSO32; 6-DoF; Accelerometer; Gyroscope; IMU; Sensor; IC; I2C; SPI; Adafruit; 4692; STEMMA; QWIIC"
  license: MIT

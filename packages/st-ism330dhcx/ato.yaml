requires-atopile: "^0.10.8"

paths:
  src: ./
  layout: ./layouts

builds:
  default:
    entry: st-ism330dhcx.ato:ST_ISM330DHCX
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]
  usage:
    entry: usage.ato:Usage
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]

package:
  identifier: atopile/st-ism330dhcx
  repository: https://github.com/atopile/packages
  homepage: https://github.com/atopile/packages/blob/main/packages/st-ism330dhcx/README.md
  version: "0.1.0"
  authors:
    - name: atopile
      email: hi@atopile.io
  summary: "STMicroelectronics; ISM330DHCX; 6-Axis; IMU; Accelerometer; Gyroscope; I2C; SPI; Motion; Sensor; AI"
  license: MIT

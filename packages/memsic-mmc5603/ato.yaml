requires-atopile: "^0.10.8"

paths:
  src: ./
  layout: ./layouts

builds:
  default:
    entry: memsic-mmc5603.ato:MEMSIC_MMC5603
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]
  usage:
    entry: usage.ato:Usage
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]

package:
  identifier: atopile/memsic-mmc5603
  repository: https://github.com/atopile/packages
  homepage: https://github.com/atopile/packages/blob/main/packages/memsic-mmc5603/README.md
  version: "0.1.1"
  authors:
    - name: atopile
      email: hi@atopile.io
  summary: "Tags: MEMSIC; MMC5603; Magnetometer; Magnetic; Sensor; IC; I2C; C404328; 3-axis"
  license: MIT

requires-atopile: ^0.14.0

paths:
  src: "."
  layout: ./layouts

builds:
  xt30_male_right_angle:
    entry: xt-connectors.ato:XT30_Male_Right_Angle
    exclude_checks: ["PCB.requires_drc_check"]
    hide_designators: true
  xt30_male_vertical:
    entry: xt-connectors.ato:XT30_Male_Vertical
    exclude_checks: ["PCB.requires_drc_check"]
    hide_designators: true
  xt30_female_right_angle:
    entry: xt-connectors.ato:XT30_Female_Right_Angle
    exclude_checks: ["PCB.requires_drc_check"]
    hide_designators: true
  xt30_female_vertical:
    entry: xt-connectors.ato:XT30_Female_Vertical
    exclude_checks: ["PCB.requires_drc_check"]
    hide_designators: true
  usage:
    entry: usage.ato:Usage
    exclude_checks: ["PCB.requires_drc_check"]
    hide_designators: true

package:
  identifier: atopile/xt-connectors
  repository: https://github.com/atopile/packages
  version: 0.2.1
  authors:
    - name: atopile
      email: hi@atopile.io
  summary: XT power connectors
  license: MIT

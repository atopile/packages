requires-atopile: "^0.9.0"

paths:
  src: "."
  layout: ./layouts

builds:
  single:
    entry: nau7802.ato:NAU7802
    exclude_checks: ['PCB.requires_drc_check']
  dual:
    entry: nau7802.ato:NAU7802_Dual
    exclude_checks: ['PCB.requires_drc_check']

package:
  identifier: atopile/nau7802
  repository: https://github.com/atopile/packages
  version: "0.1.4"
  authors:
    - name: atopile
      email: hi@atopile.io
  summary: High-precision 24-bit, low-noise, low-power, digital output load cell amplifier
  license: MIT

requires-atopile: ^0.14.0
paths:
  src: ./
  layout: ./layouts
builds:
  default:
    entry: bosch-bme688.ato:Bosch_BME688
    hide_designators: true
    exclude_checks:
    - PCB.requires_drc_check
  usage:
    entry: usage.ato:Usage
    hide_designators: true
    exclude_checks:
    - PCB.requires_drc_check
package:
  identifier: atopile/bosch-bme688
  repository: https://github.com/atopile/packages

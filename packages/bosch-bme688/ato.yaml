  version: 0.2.0
  authors:
  - name: atopile
    email: hi@atopile.io
  summary: 'Tags: Bosch; BME688; Temperature; Humidity; Pressure; Gas; Sensor; IC;
    I2C; SPI; Adafruit; 5046; Environmental; VOC; Air Quality'
  license: MIT

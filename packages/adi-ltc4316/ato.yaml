requires-atopile: "^0.10.8"

paths:
  src: ./
  layout: ./layouts

builds:
  default:
    entry: adi-ltc4316.ato:ADI_LTC4316
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]
  usage:
    entry: usage.ato:Usage
    hide_designators: true
    exclude_checks: ["PCB.requires_drc_check"]

package:
  identifier: atopile/adi-ltc4316
  repository: https://github.com/atopile/packages
  homepage: https://github.com/atopile/packages/blob/main/packages/adi-ltc4316/README.md
  version: "0.1.0"
  authors:
    - name: atopile
      email: hi@atopile.io
  summary: "Tags: ADI; LTC4316; I2C; Address Translator; Interface; IC; Analog Devices; C688147; STEMMA QT; Qwiic; Address Conflict Resolution"
  license: MIT

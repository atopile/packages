requires-atopile: ^0.14.0
paths:
  src: ./
  layout: ./layouts
builds:
  maxim-ds18b20:
    entry: maxim-ds18b20.ato:Maxim_DS18B20
    hide_designators: true
    exclude_checks:
    - PCB.requires_drc_check
  maxim-ds18b20u:
    entry: maxim-ds18b20.ato:Maxim_DS18B20U
    hide_designators: true
    exclude_checks:
    - PCB.requires_drc_check
  maxim-ds18b20z:
    entry: maxim-ds18b20.ato:Maxim_DS18B20Z
    hide_designators: true
    exclude_checks:
    - PCB.requires_drc_check
  usage:
    entry: usage.ato:Usage
    hide_designators: true
    exclude_checks:
    - PCB.requires_drc_check
package:
  identifier: atopile/maxim-ds18b20
  repository: https://github.com/atopile/packages
  homepage: https://github.com/atopile/packages/blob/main/packages/maxim-ds18b20/README.md
  version: "0.2.1"
  authors:
  - name: atopile
    email: hi@atopile.io
  summary: 'Tags: Maxim; DS18B20; Temperature; Sensor; IC; 1-Wire; Digital; Programmable;
    Waterproof'
  license: MIT
